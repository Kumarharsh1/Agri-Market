name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Prepare Data (if needed)
      # We run the script. If raw data is missing (not in git), this might fail or do nothing.
      # Ideally, for CI we should have a small sample or mock. 
      # Since we don't have raw data in git, we'll create a dummy processed file for testing flow if real one missing.
      run: |
        mkdir -p data/processed
        # Create a dummy CSV if script fails or data missing, so tests don't crash on import
        echo "Date,Market,Modal_Price,Min_Price,Max_Price" > data/processed/onion_maharashtra_cleaned.csv
        echo "2023-01-01,TestMarket,100,90,110" >> data/processed/onion_maharashtra_cleaned.csv
        echo "2023-01-02,TestMarket,105,95,115" >> data/processed/onion_maharashtra_cleaned.csv
        echo "2023-01-03,TestMarket,102,92,112" >> data/processed/onion_maharashtra_cleaned.csv
        echo "2023-01-04,TestMarket,108,98,118" >> data/processed/onion_maharashtra_cleaned.csv
        echo "2023-01-05,TestMarket,110,100,120" >> data/processed/onion_maharashtra_cleaned.csv
      
    - name: Run tests
      run: |
        pytest tests/
